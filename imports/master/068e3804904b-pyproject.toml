[project]
name = "savvytech_marketing_engine"
version = "0.1.0"
description = "savvytech_marketing_engine using crewAI"
authors = [{ name = "Your Name", email = "you@example.com" }]
requires-python = ">=3.10,<3.14"
dependencies = [
    "crewai[file-processing,litellm,tools]>=1.15.5,<2.0.0",
    "exa-py",
]

[project.scripts]
savvytech_marketing_engine = "savvytech_marketing_engine.main:run"
run_crew = "savvytech_marketing_engine.main:run"
train = "savvytech_marketing_engine.main:train"
replay = "savvytech_marketing_engine.main:replay"
test = "savvytech_marketing_engine.main:test"
run_with_trigger = "savvytech_marketing_engine.main:run_with_trigger"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.crewai]
type = "crew"

[tool.uv]
override-dependencies = ["litellm<=1.82.6"]
